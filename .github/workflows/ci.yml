name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

# The repository's Nix jobs run on all three Nix-capable ephemeral classes.
# Windows x64/ARM64 guests do not provide Nix and are not nested-hypervisor
# hosts. Their named host-level contract substitutes are maintained in infra:
# checks/t_windows_sysprep_golden.sh and checks/t_m3_arm_ephemeral.sh.

# Collapse superseded pull-request runs only.
#
# `github.head_ref` is set on `pull_request` and empty everywhere else, so PR
# runs group per source branch and a new push cancels the run it superseded.
# Pushes to the mainline branches fall through to `github.run_id`, which is
# unique per run: each keeps a group of its own and is never cancelled, so the
# per-commit build history stays complete.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        # eph-linux-arm64 dropped: the only CPU conditional in the linted
        # graph (types.nim `when defined(arm64)`) is nested inside
        # `elif defined(macosx)`, so on Linux it is unreachable and this leg
        # type-checked byte-identical code to eph-linux-x64. The macOS leg is
        # kept because it genuinely covers the `defined(macosx)` branches in
        # the tart/lima/utm/qemu_windows_arm backends that no Linux leg sees.
        runner: [eph-linux-x64, eph-macos-arm64]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup Nix
        uses: metacraft-labs/nixos-modules/.github/setup-nix@main
        with:
          trusted-public-keys: ${{ vars.TRUSTED_PUBLIC_KEYS }}
          substituters: ${{ vars.SUBSTITUTERS }}
          nix-github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Run lint checks
        run: nix develop --command just lint
      - name: Upload logs
        if: always()
        # Keep the command result authoritative if the organization-wide
        # Actions artifact quota is temporarily saturated.
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: lint-logs-${{ matrix.runner }}
          path: test-logs/
          retention-days: 1
      - name: Mirror logs to S3 (non-blocking)
        if: always()
        continue-on-error: true
        uses: metacraft-labs/metacraft-github-actions/mirror-artifacts-s3@main
        with:
          path: test-logs/
          prefix: lint-logs-${{ matrix.runner }}/${{ github.run_id }}
          endpoint: ${{ vars.MCL_S3_ARTIFACTS_ENDPOINT }}
          bucket: ${{ vars.MCL_S3_ARTIFACTS_BUCKET }}
          region: ${{ vars.MCL_S3_ARTIFACTS_REGION }}
          access-key-id: ${{ secrets.MCL_S3_ARTIFACTS_ACCESS_KEY_ID }}
          secret-access-key: ${{ secrets.MCL_S3_ARTIFACTS_SECRET_ACCESS_KEY }}

  test:
    name: Test (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [eph-linux-x64, eph-linux-arm64, eph-macos-arm64]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup Nix
        uses: metacraft-labs/nixos-modules/.github/setup-nix@main
        with:
          trusted-public-keys: ${{ vars.TRUSTED_PUBLIC_KEYS }}
          substituters: ${{ vars.SUBSTITUTERS }}
          nix-github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Run tests
        run: nix develop --command just test
      - name: Upload logs
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-${{ matrix.runner }}
          path: test-logs/
          retention-days: 1
      - name: Mirror logs to S3 (non-blocking)
        if: always()
        continue-on-error: true
        uses: metacraft-labs/metacraft-github-actions/mirror-artifacts-s3@main
        with:
          path: test-logs/
          prefix: test-logs-${{ matrix.runner }}/${{ github.run_id }}
          endpoint: ${{ vars.MCL_S3_ARTIFACTS_ENDPOINT }}
          bucket: ${{ vars.MCL_S3_ARTIFACTS_BUCKET }}
          region: ${{ vars.MCL_S3_ARTIFACTS_REGION }}
          access-key-id: ${{ secrets.MCL_S3_ARTIFACTS_ACCESS_KEY_ID }}
          secret-access-key: ${{ secrets.MCL_S3_ARTIFACTS_SECRET_ACCESS_KEY }}

  build-cli:
    name: Build CLI (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [eph-linux-x64, eph-linux-arm64, eph-macos-arm64]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup Nix
        uses: metacraft-labs/nixos-modules/.github/setup-nix@main
        with:
          trusted-public-keys: ${{ vars.TRUSTED_PUBLIC_KEYS }}
          substituters: ${{ vars.SUBSTITUTERS }}
          nix-github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Build CLI and benchmark
        run: nix develop --command just build
      - name: Upload logs
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ matrix.runner }}
          path: test-logs/
          retention-days: 1
      - name: Mirror logs to S3 (non-blocking)
        if: always()
        continue-on-error: true
        uses: metacraft-labs/metacraft-github-actions/mirror-artifacts-s3@main
        with:
          path: test-logs/
          prefix: build-logs-${{ matrix.runner }}/${{ github.run_id }}
          endpoint: ${{ vars.MCL_S3_ARTIFACTS_ENDPOINT }}
          bucket: ${{ vars.MCL_S3_ARTIFACTS_BUCKET }}
          region: ${{ vars.MCL_S3_ARTIFACTS_REGION }}
          access-key-id: ${{ secrets.MCL_S3_ARTIFACTS_ACCESS_KEY_ID }}
          secret-access-key: ${{ secrets.MCL_S3_ARTIFACTS_SECRET_ACCESS_KEY }}

  nix-build:
    name: Nix Build (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [eph-linux-x64, eph-linux-arm64, eph-macos-arm64]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup Nix
        uses: metacraft-labs/nixos-modules/.github/setup-nix@main
        with:
          trusted-public-keys: ${{ vars.TRUSTED_PUBLIC_KEYS }}
          substituters: ${{ vars.SUBSTITUTERS }}
          nix-github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Build default Nix package
        run: nix develop --command just nix-build
      - name: Upload logs
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: nix-build-logs-${{ matrix.runner }}
          path: test-logs/
          retention-days: 1
      - name: Mirror logs to S3 (non-blocking)
        if: always()
        continue-on-error: true
        uses: metacraft-labs/metacraft-github-actions/mirror-artifacts-s3@main
        with:
          path: test-logs/
          prefix: nix-build-logs-${{ matrix.runner }}/${{ github.run_id }}
          endpoint: ${{ vars.MCL_S3_ARTIFACTS_ENDPOINT }}
          bucket: ${{ vars.MCL_S3_ARTIFACTS_BUCKET }}
          region: ${{ vars.MCL_S3_ARTIFACTS_REGION }}
          access-key-id: ${{ secrets.MCL_S3_ARTIFACTS_ACCESS_KEY_ID }}
          secret-access-key: ${{ secrets.MCL_S3_ARTIFACTS_SECRET_ACCESS_KEY }}
